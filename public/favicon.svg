<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#18181B" />
      <stop offset="100%" stop-color="#09090B" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF0CD" />
      <stop offset="40%" stop-color="#E5C158" />
      <stop offset="75%" stop-color="#C59B27" />
      <stop offset="100%" stop-color="#9A7B1C" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#D4AF37" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Circular Obsidian Canvas -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)" stroke="#27272A" stroke-width="6" />
  
  <!-- Subtle Outer Precision Ring -->
  <circle cx="256" cy="256" r="216" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="8 6" opacity="0.4" />

  <!-- Monolith / 'A' Emblem with Acoustic Soundwave Geometries -->
  <g filter="url(#subtleGlow)">
    <!-- Apex & Left Pillar -->
    <path d="M256 96 L144 384 L196 384 L228 296 L284 296 L316 384 L368 384 Z M256 184 L272 254 L240 254 Z" fill="url(#goldGrad)" />
    
    <!-- Central Bass Wave Bars -->
    <rect x="246" y="324" width="20" height="60" rx="10" fill="url(#goldGrad)" />
    <rect x="214" y="340" width="16" height="44" rx="8" fill="url(#goldGrad)" opacity="0.85" />
    <rect x="282" y="340" width="16" height="44" rx="8" fill="url(#goldGrad)" opacity="0.85" />
    <rect x="186" y="354" width="12" height="30" rx="6" fill="url(#goldGrad)" opacity="0.65" />
    <rect x="314" y="354" width="12" height="30" rx="6" fill="url(#goldGrad)" opacity="0.65" />
  </g>
</svg>
